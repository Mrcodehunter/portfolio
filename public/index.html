    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <script>
      // Restore the real path after the 404.html redirect (GitHub Pages serves
      // static files only, so /about would otherwise 404 on refresh).
      (function () {
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();

      // Apply the stored theme before first paint to avoid a flash of the
      // wrong palette. Must stay in sync with src/hooks/useTheme.js.
      (function () {
        try {
          var t = localStorage.getItem('theme-mode') || 'dark';
          if (t === 'dark') document.documentElement.classList.add('theme-dark');
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
  </head>
  <body>

    <div id="root"></div>
  </body>
